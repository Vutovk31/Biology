<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Моногибридное скрещивание — бесплатная задача</title><link rel="stylesheet" href="../styles.css"><style>.lesson{padding:50px 0}.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.lesson-card{background:#fff;padding:25px;border-radius:20px;border:1px solid var(--line)}.punnett{width:100%;border-spacing:8px}.punnett th,.punnett td{height:70px;border-radius:12px;text-align:center;background:var(--soft);font-size:22px}.punnett th{background:var(--green);color:#fff}@media(max-width:800px){.gen-grid{grid-template-columns:1fr}}</style><script defer src="genetics.js"></script></head><body><main class="lesson"><div class="container"><a href="../index.html#materials">← Вернуться на сайт</a><p class="eyebrow">Бесплатная интерактивная задача</p><h1>Моногибридное скрещивание</h1><div class="gen-grid"><div class="lesson-card"><label>Первый родитель<select id="p1"><option>AA</option><option selected>Aa</option><option>aa</option></select></label><label>Второй родитель<select id="p2"><option>AA</option><option selected>Aa</option><option>aa</option></select></label><button id="build" class="button">Построить решётку</button><p>Аллель A — доминантный, a — рецессивный.</p></div><div class="lesson-card"><table class="punnett"><tr><th></th><th id="x1">A</th><th id="x2">a</th></tr><tr><th id="y1">A</th><td id="c11">AA</td><td id="c12">Aa</td></tr><tr><th id="y2">a</th><td id="c21">Aa</td><td id="c22">aa</td></tr></table><p>Доля рецессивного фенотипа: <strong id="percent">25%</strong></p></div></div><div class="lesson-card" style="margin-top:25px"><label>Введите долю рецессивного фенотипа, %<input id="answer" type="number" min="0" max="100"></label><button id="check" class="button">Проверить</button><p id="result"></p></div></div></main></body></html>
