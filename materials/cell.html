<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Клетка и органоиды — бесплатный урок</title><link rel="stylesheet" href="../styles.css"><style>.lesson{padding:50px 0}.lesson-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.cell-map{min-height:420px;border:5px solid var(--green2);border-radius:47%;background:#dcefe5;position:relative}.org{position:absolute;border:0;cursor:pointer}.nucleus{width:115px;height:115px;border-radius:50%;background:var(--gold);left:35%;top:34%}.mito{width:95px;height:44px;border-radius:50%;background:#e88c61;left:12%;top:22%}.ribo{width:30px;height:30px;border-radius:50%;background:#5682a0;right:20%;top:20%}.lesson-card{background:#fff;padding:25px;border-radius:20px;border:1px solid var(--line)}.choices{display:grid;gap:9px}.choices button{padding:12px;border:1px solid var(--line);background:#fff;border-radius:10px;text-align:left}@media(max-width:800px){.lesson-grid{grid-template-columns:1fr}}</style><script defer src="cell.js"></script></head><body><main class="lesson"><div class="container"><a href="../index.html#materials">← Вернуться на сайт</a><p class="eyebrow">Бесплатный интерактивный урок</p><h1>Клетка и её органоиды</h1><p class="hero-lead">Нажимайте на элементы схемы и проверьте себя.</p><div class="lesson-grid"><div class="lesson-card"><div class="cell-map"><button class="org nucleus" data-key="nucleus" aria-label="Ядро"></button><button class="org mito" data-key="mito" aria-label="Митохондрия"></button><button class="org ribo" data-key="ribo" aria-label="Рибосома"></button></div></div><div class="lesson-card"><h2 id="org-title">Выберите органоид</h2><p id="org-text">Описание появится после нажатия на элемент.</p><div class="choices"><button data-key="nucleus">Ядро</button><button data-key="mito">Митохондрия</button><button data-key="ribo">Рибосома</button></div><h3>Самопроверка</h3><p>Какой органоид отвечает за синтез белка?</p><div class="choices"><button data-answer="false">Ядро</button><button data-answer="true">Рибосома</button><button data-answer="false">Митохондрия</button></div><p id="feedback"></p></div></div></div></main></body></html>
